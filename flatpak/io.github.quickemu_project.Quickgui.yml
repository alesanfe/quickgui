app-id: io.github.quickemu_project.Quickgui
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18
command: quickgui

finish-args:
  # Downloads via quickget and display/notification sockets
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # VMs live in the user-selected working directory
  - --filesystem=home
  # Desktop notifications for finished downloads
  - --talk-name=org.freedesktop.Notifications
  # quickget/quickemu are invoked as external commands on the host
  - --talk-name=org.freedesktop.Flatpak

modules:
  # tray_manager needs ayatana-appindicator3-0.1 (headers at build time,
  # library at runtime). Not shipped in the freedesktop runtime, so the
  # gtk3 flavour chain is built here (mirrors flathub shared-modules).
  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DFLAVOUR_GTK3=ON
      - -DENABLE_BINDINGS_VALA=OFF
      - -DENABLE_BINDINGS_MONO=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.93.tar.gz
        sha256: cbefed7a918a227bf71286246e237fcd3a9c8499b3eaac4897811a869409edf0
    modules:
      - name: libdbusmenu
        buildsystem: autotools
        config-opts:
          - --with-gtk=3
          - --disable-scrollkeeper
          - --enable-introspection=no
          - --enable-vala=no
          - --disable-tests
          - --disable-dumper
        cleanup:
          - /include
          - /lib/pkgconfig
          - '*.la'
          - '*.a'
        sources:
          - type: archive
            url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
            sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      - name: libayatana-indicator
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - -DFLAVOUR_GTK3=ON
          - -DENABLE_IDO=OFF
          - -DENABLE_TESTS=OFF
        cleanup:
          - /include
          - /lib/pkgconfig
          - '*.la'
          - '*.a'
        sources:
          - type: archive
            url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
            sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95

  - name: quickgui
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        PUB_CACHE: /run/build/quickgui/.flatpak-pub-cache
        PATH: /usr/lib/sdk/llvm18/bin:/app/bin:/usr/bin
    build-commands:
      - git config --global --add safe.directory "${PWD}/flutter"
      - rm -rf build .dart_tool
      - ${PWD}/flutter/bin/flutter config --no-analytics --enable-linux-desktop
      - ${PWD}/flutter/bin/flutter pub get
      - ${PWD}/flutter/bin/flutter build linux --release
      - install -Dm755 build/linux/x64/release/bundle/quickgui /app/bin/quickgui
      - cp -r build/linux/x64/release/bundle/lib /app/bin/lib
      - cp -r build/linux/x64/release/bundle/data /app/bin/data
      - install -Dm644 assets/resources/quickgui.desktop
        /app/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/"
        /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 assets/resources/quickgui_512.png
        /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644
        flatpak/io.github.quickemu_project.Quickgui.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ..
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.8-stable.tar.xz
        sha256: baf7dcc5a3dbba60fe863bf493a6cf203195621f7786eaa5a1bba02cd0d87dd2
        dest: flutter
