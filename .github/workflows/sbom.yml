name: sbom
on:
  release:
    types: [published]
  workflow_dispatch: {}
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: quickgui-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: quickgui-sbom.spdx.json
